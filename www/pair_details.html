<script src="https://unpkg.com/lightweight-charts@4.2.2/dist/lightweight-charts.standalone.production.js"></script>
<script>
const qs = new URLSearchParams(location.search);
const strategyId = Number(qs.get('strategy_id') || 0);
if (!strategyId) {
  alert('Потрібен параметр strategy_id у посиланні');
}

let chart, candleSeries;
const priceLines = [];

let chartTrades = [];
let chartTfSec = 3600;

const TF_SEC = { '1m': 60, '5m': 300, '15m': 900, '1h': 3600, '4h': 14400, '1d': 86400 };

function fmtQty(v){
  const n = Number(v);
  if (!isFinite(n)) return '—';
  if (n >= 1) return n.toFixed(4).replace(/\.?0+$/, '');
  return n.toFixed(8).replace(/\.?0+$/, '');
}
function fmtUsdt(v){
  const n = Number(v);
  if (!isFinite(n)) return '—';
  return n.toFixed(2);
}
function fmtPrice(v){
  const n = Number(v);
  if (!isFinite(n)) return '—';
  if (n >= 1) return n.toFixed(4);
  return n.toFixed(6);
}

function snapTradeTimeToCandle(tradeSec, candles){
  if (!candles.length || !isFinite(tradeSec)) return tradeSec;
  let best = candles[0].time;
  let bestDiff = Math.abs(best - tradeSec);
  for (let i = 1; i < candles.length; i++){
    const t = candles[i].time;
    const d = Math.abs(t - tradeSec);
    if (d < bestDiff){ bestDiff = d; best = t; }
  }
  return best;
}

function buildTradeMarkers(trades, candles){
  return (trades || []).map(function(tr){
    const isSell = String(tr.side || '') === 'sell';
    const lvl = tr.level_label ? (' ' + tr.level_label) : '';
    const short = isSell ? ('S' + lvl) : ('B' + lvl);
    return {
      time: snapTradeTimeToCandle(Number(tr.time), candles),
      position: isSell ? 'aboveBar' : 'belowBar',
      color: isSell ? '#ef4444' : '#22c55e',
      shape: isSell ? 'arrowDown' : 'arrowUp',
      text: short.trim(),
      _trade: tr
    };
  });
}

function tradeTooltipHtml(tr){
  const isSell = String(tr.side || '') === 'sell';
  const asset = String(tr.asset || '').trim() || 'монет';
  const qty = fmtQty(tr.qty);
  const price = fmtPrice(tr.price);
  const quote = fmtUsdt(tr.quote_usdt);
  const lvl = tr.level_label ? (' · ' + tr.level_label) : '';
  const et = tr.event_type ? ('<div class="muted" style="font-size:11px">' + String(tr.event_type) + '</div>') : '';
  let pnl = '';
  if (isSell && tr.pnl_usdt != null && isFinite(Number(tr.pnl_usdt))){
    const p = Number(tr.pnl_usdt);
    const sign = p >= 0 ? '+' : '';
    pnl = '<div style="margin-top:4px">P/L: <b>' + sign + fmtUsdt(p) + ' USDT</b></div>';
  }
  if (isSell){
    return '<div class="tt-title tt-sell">Продаж</div>' +
      '<div>Продано <b>' + qty + ' ' + asset + '</b></div>' +
      '<div>Ціна: <b>' + price + '</b> · сума ≈ <b>' + quote + ' USDT</b></div>' +
      pnl + et;
  }
  return '<div class="tt-title tt-buy">Купівля</div>' +
    '<div>Куплено <b>' + qty + ' ' + asset + '</b></div>' +
    '<div>Ціна: <b>' + price + '</b> · сума ≈ <b>' + quote + ' USDT</b></div>' + et;
}

function hideTradeTooltip(){
  const el = document.getElementById('tradeTooltip');
  if (el) el.classList.remove('show');
}

function showTradeTooltip(x, y, tr){
  const box = document.getElementById('chart');
  const el = document.getElementById('tradeTooltip');
  if (!box || !el || !tr) return;
  el.innerHTML = tradeTooltipHtml(tr);
  el.classList.add('show');
  const pad = 12;
  const rect = box.getBoundingClientRect();
  let left = x - rect.left + pad;
  let top = y - rect.top + pad;
  el.style.left = left + 'px';
  el.style.top = top + 'px';
  requestAnimationFrame(function(){
    const w = el.offsetWidth;
    const h = el.offsetHeight;
    if (left + w > rect.width - 8) left = Math.max(8, x - rect.left - w - pad);
    if (top + h > rect.height - 8) top = Math.max(8, y - rect.top - h - pad);
    el.style.left = left + 'px';
    el.style.top = top + 'px';
  });
}

function findTradeNearCrosshair(time, price, tf){
  if (!time || !chartTrades.length) return null;
  const half = (TF_SEC[tf] || chartTfSec || 3600) / 2;
  let best = null;
  let bestScore = Infinity;
  for (let i = 0; i < chartTrades.length; i++){
    const tr = chartTrades[i];
    const dt = Math.abs(Number(tr.time) - Number(time));
    if (dt > half) continue;
    const p = Number(tr.price);
    let dp = 0;
    if (isFinite(p) && p > 0 && isFinite(price) && price > 0){
      dp = Math.abs(p - price) / price;
    }
    const score = dt + dp * 100000;
    if (score < bestScore){ bestScore = score; best = tr; }
  }
  if (best && isFinite(price) && Number(best.price) > 0){
    const rel = Math.abs(Number(best.price) - price) / price;
    if (rel > 0.08) return null;
  }
  return best;
}

function applyTradeMarkers(trades, candles){
  chartTrades = Array.isArray(trades) ? trades.slice() : [];
  const markers = buildTradeMarkers(chartTrades, candles);
  try { candleSeries.setMarkers(markers); } catch(_e){}
}


function clearPriceLines(){
  while(priceLines.length){
    const ln = priceLines.pop();
    try { candleSeries.removePriceLine(ln); } catch(_e){}
  }
}

function addLine(price, color, title){
  const p = Number(price);
  if (!isFinite(p) || p <= 0) return;
  const ln = candleSeries.createPriceLine({
    price: p,
    color,
    lineWidth: 2,
    lineStyle: 2,
    axisLabelVisible: true,
    title: title || ''
  });
  priceLines.push(ln);
}

async function fetchJson(url){
  const r = await fetch(url, { credentials:'include', cache:'no-store' });
  if (r.status === 401) {
    location.href = '/auth/login.php?ret=' + encodeURIComponent(location.pathname + location.search);
    throw new Error('unauthorized');
  }
  return await r.json();
}

function buildMergedRows(gridLevels, openLevels, nextPtr, tpPrice, missedLevels){
  const missedSet = new Set((Array.isArray(missedLevels) ? missedLevels : []).map(n=>Number(n)).filter(n=>n>0));
  const openBy = new Map();
  (openLevels || []).forEach(o=>{
    const n = Number(o.level);
    if (isFinite(n) && n > 0) openBy.set(n, o);
  });
  const seenIdx = new Set();
  const rows = [];
  (gridLevels || []).forEach(g=>{
    const idx = Number(g.level_idx);
    seenIdx.add(idx);
    const open = openBy.get(idx);
    const price = open && open.buy_price != null ? Number(open.buy_price) : Number(g.buy_price);
    let state = 'future';
    let stateUk = 'Майбутній';
    let color = '#60a5fa';
    if (open) {
      state = 'open';
      stateUk = 'Відкрито';
      color = '#fbbf24';
    } else if (missedSet.has(idx)) {
      state = 'queued';
      stateUk = 'У черзі (missed)';
      color = '#fb923c';
    } else if (isFinite(nextPtr) && idx < nextPtr) {
      state = 'past';
      stateUk = 'Минулий';
      color = '#64748b';
    }
    rows.push({ idx, price, label: 'L' + idx, state, stateUk, color });
  });
  openBy.forEach((o, idx)=>{
    if (seenIdx.has(idx)) return;
    const price = Number(o.buy_price);
    if (!isFinite(price) || price <= 0) return;
    rows.push({ idx, price, label: 'L' + idx, state: 'open', stateUk: 'Відкрито', color: '#fbbf24' });
    seenIdx.add(idx);
  });
  rows.sort((a,b)=>a.idx - b.idx);
  if (tpPrice && Number(tpPrice) > 0) {
    rows.push({ idx: 100000, price: Number(tpPrice), label: 'TP1', state: 'tp', stateUk: 'Take profit', color: '#34d399' });
  }
  return rows;
}

function renderMergedLevelList(merged){
  const box = document.getElementById('levelsList');
  if (!merged.length) {
    box.innerHTML = '<div class="muted">Немає даних рівнів</div>';
    return;
  }
  box.innerHTML = merged.map(r=>{
    return `<div class="row">
      <div style="color:${r.color};font-weight:700">${r.label}</div>
      <div class="mono">${Number(r.price).toFixed(6)}</div>
      <div class="muted" style="font-size:12px;text-align:right;min-width:88px">${r.stateUk}</div>
    </div>`;
  }).join('');
}

function buildProjectedLevels(levelsCfg, pos, priceFallback){
  const out = [];
  if (!Array.isArray(levelsCfg) || !levelsCfg.length) return out;
  const nextPtr = Number((pos && pos.position && pos.position.next_ptr) || 1);
  const basePrice = Number((pos && pos.position && pos.position.base_price) || 0);
  const avg = Number((pos && pos.position && pos.position.avg_price) || 0);
  const lastBuy = Number((pos && pos.position && pos.position.last_buy) || 0);
  const qty = Number((pos && pos.position && pos.position.qty) || 0);
  // Parity with engine / saas_trade_targets: L1–L4 якір = base_price (BUY0); інакше last_buy (факт BUY0), потім avg.
  // Ніколи не підставляти ціну закриття свічки, коли вже є відкрита позиція — інакше L1 «прилипає» до ~spot (~0.247), а не до сітки (~0.253).
  let mainCoreAnchor = basePrice > 0 ? basePrice : (lastBuy > 0 ? lastBuy : avg);
  const fb = Number(priceFallback || 0);
  const allowSpotFallback = qty <= 0;
  if ((!isFinite(mainCoreAnchor) || mainCoreAnchor <= 0) && allowSpotFallback && isFinite(fb) && fb > 0) {
    mainCoreAnchor = fb;
  }
  if (!isFinite(mainCoreAnchor) || mainCoreAnchor <= 0) return out;

  // Compute display grid for first levels.
  const sorted = levelsCfg.slice().sort((a,b)=>Number(a.idx)-Number(b.idx));
  let prevSubAnchor = avg > 0 ? avg : mainCoreAnchor;
  for (const lv of sorted){
    const idx = Number(lv.idx);
    const drop = Number(lv.drop || 0);
    if (!isFinite(idx) || idx < 1) continue;
    let anchor = mainCoreAnchor;
    if (idx <= 4) {
      anchor = mainCoreAnchor;
    } else if (idx === 5) {
      anchor = avg > 0 ? avg : mainCoreAnchor;
    } else {
      anchor = prevSubAnchor > 0 ? prevSubAnchor : (avg > 0 ? avg : mainCoreAnchor);
    }
    if (!isFinite(anchor) || anchor <= 0) continue;
    const buy = anchor * (1 - drop/100);
    out.push({
      level_idx: idx,
      buy_price: buy,
      future: idx >= nextPtr
    });
    if (idx >= 5) prevSubAnchor = buy;
  }
  return out;
}

async function loadAll(){
  const tf = document.getElementById('tf').value;
  const details = await fetchJson('/auth/api_gate.php?path=saas_details.php&strategy_id=' + encodeURIComponent(String(strategyId)));
  if (!details || !details.ok) throw new Error('details failed');
  const symbol = (details.strategy && details.strategy.symbol) ? details.strategy.symbol : '—';
  const status = (details.strategy && details.strategy.status) ? details.strategy.status : '—';
  document.getElementById('hdrPair').textContent = 'Пара: ' + symbol;
  document.getElementById('hdrStatus').textContent = 'Статус: ' + String(status).toUpperCase();

  const kl = await fetch('https://api.binance.com/api/v3/klines?symbol=' + encodeURIComponent(symbol) + '&interval=' + encodeURIComponent(tf) + '&limit=1000');
  const klJson = await kl.json();
  const candles = (Array.isArray(klJson) ? klJson : []).map(r=>({
    time: Math.floor(Number(r[0]) / 1000),
    open: Number(r[1]), high: Number(r[2]), low: Number(r[3]), close: Number(r[4])
  }));
  const lastClose = candles.length ? Number(candles[candles.length - 1].close) : 0;

  const core = await fetchJson('/auth/api_gate.php?path=saas_core.php');
  const items = (((core||{}).strategies||{}).items || []);
  const st = items.find(x=>Number(x.strategy_id)===Number(strategyId)) || null;
  const tpPrice = st && st.targets ? Number(st.targets.main_sell_price || 0) : 0;
  const pos = await fetchJson('/auth/api_gate.php?path=position_state.php&strategy_id=' + encodeURIComponent(String(strategyId)));
  let gridLevels = [];
  try {
    const sl = await fetchJson('/auth/api_gate.php?path=strategy_pair_levels.php&strategy_id=' + encodeURIComponent(String(strategyId)));
    if (sl && sl.ok && Array.isArray(sl.items) && sl.items.length) {
      gridLevels = sl.items.map(x => ({
        level_idx: Number(x.level_idx),
        buy_price: Number(x.buy_price)
      }));
    }
  } catch (_e) {}
  if (!gridLevels.length) {
    const cfg = await fetchJson('/auth/api_gate.php?path=get_strategy_db.php&strategy_id=' + encodeURIComponent(String(strategyId)));
    const levelsCfg = (cfg && Array.isArray(cfg.levels)) ? cfg.levels : [];
    gridLevels = buildProjectedLevels(levelsCfg, pos, lastClose);
  }
  if (!gridLevels.length && symbol && symbol !== '—') {
    try {
      const fl = await fetchJson('/auth/api_gate.php?path=future_levels.php&symbol=' + encodeURIComponent(symbol));
      if (fl && fl.ok && Array.isArray(fl.next_levels) && fl.next_levels.length) {
        gridLevels = fl.next_levels.map(x => ({
          level_idx: Number(x.level_idx),
          buy_price: Number(x.buy_price)
        }));
      }
    } catch (_e) {}
  }

  const nextPtr = Number((pos && pos.position && pos.position.next_ptr) || 1);
  const missedLvls = (pos && pos.position && Array.isArray(pos.position.ladder_missed_levels))
    ? pos.position.ladder_missed_levels
    : [];

  chartTfSec = TF_SEC[tf] || 3600;

  let trades = [];
  try {
    const tr = await fetchJson('/auth/api_gate.php?path=strategy_chart_trades.php&strategy_id=' + encodeURIComponent(String(strategyId)) + '&limit=400');
    if (tr && tr.ok && Array.isArray(tr.items)) trades = tr.items;
  } catch (_e) {}

  candleSeries.setData(candles);
  applyTradeMarkers(trades, candles);
  chart.timeScale().fitContent();

  clearPriceLines();
  const openLevels = (details.levels && Array.isArray(details.levels.items)) ? details.levels.items : [];
  const merged = buildMergedRows(gridLevels, openLevels, nextPtr, tpPrice > 0 ? tpPrice : null, missedLvls);
  merged.forEach(r=> addLine(r.price, r.color, r.label));

  renderMergedLevelList(merged);
}

function initChart(){
  chart = LightweightCharts.createChart(document.getElementById('chart'), {
    layout: { background: { color:'#111827' }, textColor:'#e5e7eb' },
    grid: { vertLines:{ color:'rgba(255,255,255,.07)' }, horzLines:{ color:'rgba(255,255,255,.07)' } },
    rightPriceScale: { borderColor:'#334155' },
    timeScale: { borderColor:'#334155', timeVisible:true, secondsVisible:false },
    crosshair: { mode: 0 },
  });
  candleSeries = chart.addCandlestickSeries({
    upColor:'#22c55e', downColor:'#ef4444', borderVisible:false, wickUpColor:'#22c55e', wickDownColor:'#ef4444'
  });
  const chartEl = document.getElementById('chart');
  new ResizeObserver(()=>chart.applyOptions({ width: chartEl.clientWidth })).observe(chartEl);

  chart.subscribeCrosshairMove(function(param){
    if (!param || !param.point || param.time == null){
      hideTradeTooltip();
      return;
    }
    const sd = param.seriesData && param.seriesData.get ? param.seriesData.get(candleSeries) : null;
    const price = sd && sd.close != null ? Number(sd.close) : (sd && sd.value != null ? Number(sd.value) : NaN);
    const tf = document.getElementById('tf') ? document.getElementById('tf').value : '1h';
    const tr = findTradeNearCrosshair(param.time, price, tf);
    if (tr) showTradeTooltip(param.point.x, param.point.y, tr);
    else hideTradeTooltip();
  });
  chartEl.addEventListener('mouseleave', hideTradeTooltip);
}

document.getElementById('btnReload').addEventListener('click', ()=>loadAll().catch(e=>alert('Помилка: '+e.message)));
document.getElementById('tf').addEventListener('change', ()=>loadAll().catch(e=>alert('Помилка: '+e.message)));

initChart();
loadAll().catch(e=>{
  console.error(e);
  document.getElementById('levelsList').innerHTML = '<div class="muted">Не вдалося завантажити дані: ' + String(e.message || e) + '</div>';
